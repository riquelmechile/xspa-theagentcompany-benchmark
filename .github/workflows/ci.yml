name: benchmark-ci

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q harness tests
      - name: V6 portability guard
        run: |
          if grep -R -nE '/home/|/Users/' harness/v6_contract.py harness/v6_direct.py harness/v6_sut.py tests/test_v6_contract.py tests/test_v6_direct.py tests/test_v6_sut.py; then
            echo 'absolute path found in V6 files' >&2
            exit 1
          fi
